name: E2E
on:
    release: { types: [published] }
    workflow_dispatch:
permissions:
    contents: read
jobs:
    smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22 }
            - run: npm ci
            - run: npm run build
            - run: npm run test:e2e
              env:
                  CHATBASE_API_URL: ${{ secrets.CHATBASE_E2E_API_URL }}
                  CHATBASE_E2E_API_KEY: ${{ secrets.CHATBASE_E2E_API_KEY }}
                  CHATBASE_E2E_AGENT_ID: ${{ secrets.CHATBASE_E2E_AGENT_ID }}
