name: Release
on:
    push: { branches: [main] }
    workflow_dispatch:
permissions:
    contents: write
    pull-requests: write
    id-token: write
jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.rp.outputs.release_created }}
            version: ${{ steps.rp.outputs.version }}
            pr: ${{ steps.rp.outputs.pr }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
            # release-please can't run project tooling, so the README's
            # version-pinned "See code" links go stale in its release PR and
            # fail CI's readme-freshness gate. Regenerate and push them onto
            # the PR branch here — PAT checkout/push so the PR's CI re-runs.
            #
            # Prefer the PR from this run's action output; otherwise look up an
            # already-open release-please PR (prs_created is false when RP
            # didn't create/update anything this push).
            - id: pr-branch
              env:
                  PR_JSON: ${{ steps.rp.outputs.pr }}
                  GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
              run: |
                  set -euo pipefail
                  branch=""
                  if [ -n "${PR_JSON:-}" ] && [ "$PR_JSON" != "null" ]; then
                      branch=$(jq -r '.headBranchName // empty' <<< "$PR_JSON")
                  fi
                  if [ -z "$branch" ]; then
                      branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
                          --json headRefName \
                          --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // empty')
                  fi
                  if [ -n "$branch" ]; then
                      echo "name=$branch" >> "$GITHUB_OUTPUT"
                      echo "has_pr=true" >> "$GITHUB_OUTPUT"
                      echo "Release PR branch: $branch"
                  else
                      echo "has_pr=false" >> "$GITHUB_OUTPUT"
                      echo "No open release-please PR; skipping README regen"
                  fi
            - if: steps.pr-branch.outputs.has_pr == 'true'
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.pr-branch.outputs.name }}
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
            - if: steps.pr-branch.outputs.has_pr == 'true'
              uses: actions/setup-node@v4
              with: { node-version: 22 }
            - if: steps.pr-branch.outputs.has_pr == 'true'
              run: npm ci && npm run build && npx oclif readme
            - if: steps.pr-branch.outputs.has_pr == 'true'
              env:
                  PR_BRANCH: ${{ steps.pr-branch.outputs.name }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet || {
                      git commit -m "chore: regenerate README for release"
                      git push origin "HEAD:$PR_BRANCH"
                  }
    publish:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22 }
            - run: npm install -g npm@latest
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run spec:check
            - run: npm run build
            - run: npm test
            - run: npm publish --provenance --access public
    # Slack: a new release PR waiting to be merged, or a release whose npm
    # publish failed. Skipped when no webhook is set.
    notify:
        needs: [release-please, publish]
        if: always() && needs.release-please.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
            SLACK_REVIEWER_MENTIONS: ${{ vars.SLACK_REVIEWER_MENTIONS }}
        steps:
            - name: Compose the message
              id: msg
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
                  VERSION: ${{ needs.release-please.outputs.version }}
                  PR_JSON: ${{ needs.release-please.outputs.pr }}
                  PUBLISH_RESULT: ${{ needs.publish.result }}
              run: |
                  who="${SLACK_REVIEWER_MENTIONS:+$SLACK_REVIEWER_MENTIONS }"
                  run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  text=""
                  if [ "$RELEASE_CREATED" = "true" ]; then
                      # a successful publish is silent; only a release without its npm package needs a human
                      if [ "$PUBLISH_RESULT" != "success" ]; then
                          text="${who}chatbase v$VERSION: the GitHub release exists but npm publish did not succeed ($PUBLISH_RESULT). <$run_url|Run log>"
                      fi
                  elif [ -n "$PR_JSON" ] && [ "$PR_JSON" != "null" ]; then
                      number=$(jq -r '.number // empty' <<<"$PR_JSON")
                      if [ -n "$number" ]; then
                          pr=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json url,title,createdAt)
                          created=$(jq -r .createdAt <<<"$pr")
                          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
                          # release-please updates the PR on every push to main; announce only a new one
                          if [ "$age" -lt 900 ]; then
                              text="${who}a release PR is ready: <$(jq -r .url <<<"$pr")|$(jq -r .title <<<"$pr")>. Merge it to publish."
                          fi
                      fi
                  fi
                  echo "text=$text" >> "$GITHUB_OUTPUT"
            - name: Notify Slack
              if: steps.msg.outputs.text != '' && env.SLACK_WEBHOOK_URL != ''
              uses: slackapi/slack-github-action@v4.0.0
              with:
                  webhook: ${{ env.SLACK_WEBHOOK_URL }}
                  webhook-type: incoming-webhook
                  payload: |
                      text: ${{ toJSON(steps.msg.outputs.text) }}
