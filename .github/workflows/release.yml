name: Release
on:
    push: { branches: [main] }
permissions:
    contents: write
    pull-requests: write
    id-token: write
jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.rp.outputs.release_created }}
        steps:
            - id: rp
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
            # release-please can't run project tooling, so the README's
            # version-pinned "See code" links go stale in its release PR and
            # fail CI's readme-freshness gate. Regenerate and push them onto
            # the PR branch here — PAT checkout/push so the PR's CI re-runs.
            - if: steps.rp.outputs.prs_created == 'true'
              uses: actions/checkout@v4
              with:
                  ref: release-please--branches--main
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
            - if: steps.rp.outputs.prs_created == 'true'
              uses: actions/setup-node@v4
              with: { node-version: 22 }
            - if: steps.rp.outputs.prs_created == 'true'
              run: npm ci && npm run build && npx oclif readme
            - if: steps.rp.outputs.prs_created == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet || {
                      git commit -m "chore: regenerate README for release"
                      git push origin HEAD:release-please--branches--main
                  }
    publish:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22 }
            - run: npm install -g npm@latest
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run spec:check
            - run: npm run build
            - run: npm test
            - run: npm publish --provenance --access public
