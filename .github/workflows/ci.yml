name: CI
on:
    push: { branches: [main] }
    pull_request:
jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                node: [20, 22]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: '${{ matrix.node }}' }
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run spec:check
            - run: npm test
            - run: npm run build
            - run: node scripts/check-startup.mjs
