name: Claude
# Interactive mode: mention @claude in an issue, PR comment, or review and it
# picks up the thread. Mainly for follow-ups on the PRs that spec-sync.yml
# opens ("@claude add a --priority flag to tickets create too").
on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]
    issues:
        types: [opened, assigned]
jobs:
    claude:
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
            (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read # lets Claude read CI results on the PR
        steps:
            - uses: actions/checkout@v4
              with: { fetch-depth: 1 }
            - uses: actions/setup-node@v4
              with: { node-version: 22, cache: npm }
            - run: npm ci
            - uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  claude_args: >-
                      --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh pr:*),Bash(bash scripts/*),Bash(cat:*),Bash(ls:*),Bash(diff:*),Bash(jq:*)"
